[package]
name = "vyges-gpl"
version = "0.1.49"
edition = "2021"
description = "Global placement: the placer's view of the design (instances, nets, pins, regions), then initial and Nesterov placement."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/gpl"

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = ["cli"]
# The command-line engine: the database and JSON jobs.
cli = ["dep:vyges-opendb", "vyges-opendb/gen-write", "dep:serde_json", "dep:vyges-grt", "dep:vyges-stt", "dep:vyges-rsz"]

[dependencies]
# The suite's logger: the run's lines in the reference's format, each also an event (the CLI's
# events trail).
vyges-events = { git = "https://github.com/vyges-tools/events.git", branch = "main", default-features = false }
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", optional = true }
# Routability-driven placement measures congestion on the global router's grid (its capacities
# after adjustment), as the reference's RUDY does.
vyges-grt = { git = "https://github.com/vyges-tools/grt.git", branch = "main", optional = true, default-features = false, features = ["odb"] }
# The Steiner trees and FLUTE the global router calls (`-routability_use_grt`).
vyges-stt = { git = "https://github.com/vyges-tools/stt.git", branch = "main", optional = true }
# Timing-driven placement repairs and re-times the design at each reweight with the resizer
# (repair_design, the placement-time rebuffering, the driver slacks), on the placer's database.
vyges-rsz = { git = "https://github.com/vyges-tools/rsz.git", branch = "main", optional = true, features = ["cli"] }
serde_json = { version = "1", optional = true }

[lib]
name = "vyges_gpl"
path = "src/lib.rs"

[[bin]]
name = "vyges-gpl"
path = "src/main.rs"
required-features = ["cli"]

# Local development against the sibling checkouts; a no-op for consumers pulling this by git.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/layout"]
vyges-layout = { path = "../vyges-tools-layout" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/grt.git"]
vyges-grt = { path = "../vyges-tools-grt" }

[patch."https://github.com/vyges-tools/stt.git"]
vyges-stt = { path = "../vyges-tools-stt" }

[patch."https://github.com/vyges-tools/est.git"]
vyges-est = { path = "../vyges-tools-est" }

[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/rsz.git"]
vyges-rsz = { path = "../vyges-tools-rsz" }

[patch."https://github.com/vyges-tools/dpl.git"]
vyges-dpl = { path = "../vyges-tools-dpl" }
